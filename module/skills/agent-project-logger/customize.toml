# DO NOT EDIT -- overwritten on every update.
#
# Agent customization surface for agent-project-logger.
# Team overrides:     {project-root}/_bmad/custom/agent-project-logger.toml
# Personal overrides: {project-root}/_bmad/custom/agent-project-logger.user.toml

[agent]

# --- Metadata (install-time roster contract) ---

code = "agent-project-logger"
name = "Ledger"
title = "Project Action Logger"
icon = "📒"
description = "Records project actions as guard events in the shared audit trail."
agent_type = "stateless"   # stateless | memory | autonomous

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (config load, greet). Overrides append.
activation_steps_prepend = []

# Steps to run after greet but before the agent accepts user input. Overrides append.
activation_steps_append = []

# Persistent facts the agent keeps in mind for the whole session. Overrides append.
# Each entry is a literal sentence, or `file:<path or glob>` to load a file's contents.
persistent_facts = []

# The old CSV setting `log_filename_pattern` is gone: Ledger now records events
# (see references/log-action.md). Old `*-project-log.csv` files are left as they are.
