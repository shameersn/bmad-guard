# bmad-guard team override for bmad-create-epics-and-stories (BMAD 6.12.4). Installed by
# scripts/setup_guard.py; do not edit in a project. Project-specific facts: add markdown files under
# _bmad/custom/project/bmad-create-epics-and-stories/ (loaded by the last persistent_facts entry).

[workflow]
persistent_facts = [
  "file:{project-root}/_bmad/custom/guard/references/confidence-scoring.md",
  "Frontmatter rule (Guarded BMAD): epics.md's frontmatter carries `confidence`, `confidence_label` and `confidence_rationale`. Add them if the document has no such fields.",
  "Confidence step (Guarded BMAD): in final validation, before you complete and save, self-assess confidence as the Confidence Scoring facts describe — for this document weigh unresolved requirement coverage gaps, deferred dependency or independence concerns, and story quality issues raised but not fully resolved. Write the three confidence fields into epics.md's frontmatter and tell the user the score and rationale.",
  "Per-story file mirror (team preference): whenever a story is approved and appended to epics.md, also write or update a mirror file at {planning_artifacts}/epics/epic-{n}-{epic-slug}/story-{epic}.{story}-{slug}.md with that story's full content (title, As a / I want / So that, acceptance criteria) and frontmatter `feature: F-<nnn>` (the ready-for-dev gate reads it to find the FRD). Create the per-epic folder if needed. epics.md stays the single canonical document that later steps read; say so in epics.md's Overview.",
  "FRDs first (Guarded BMAD): stories are built from the approved FRDs (one per PRD feature, at {planning_artifacts}/frds/F-<nnn>/frd.md, written by experion-frd). Before designing epics, list the PRD's features and, for each feature you will write stories for, run skill:agent-approval-gate-check with doc_type='frd-<feature>' (e.g. 'frd-F-001'), doc_path=<that frd.md>, doc_label='FRD for <feature>', downstream_label='story creation', status_field='approval_status'. A feature whose FRD is not ok gets no stories: tell the user which and why, and go on with the others only if they say so. Read each approved FRD in full; it is the requirements source for its feature's stories, ahead of the PRD.",
  "Story traceability (Guarded BMAD): each story belongs to exactly one PRD feature. Under each story in epics.md write `Feature: F-<nnn>` and `Requirements: <the FR-<Fnnn>-<nn> ids it delivers>`, and its acceptance criteria come from those FRD requirements. Every FR id of an approved FRD, other than Withdrawn ones, is covered by at least one story; list any that are not to the user. Copy the FRD's open questions into no story: the gate already checks the FRD.",
  "file:{project-root}/_bmad/custom/project/bmad-create-epics-and-stories/*.md",
]
# A single string: this skill's on_complete is not documented to accept a list.
on_complete = "skill:agent-project-logger with action 'Confidence scored for epics and stories', event='CONFIDENCE_SCORED', stage='stories', doc_path=<epics.md path>, confidence=<epics.md frontmatter confidence>, confidence_label=<frontmatter confidence_label>, confidence_rationale=<frontmatter confidence_rationale>"
