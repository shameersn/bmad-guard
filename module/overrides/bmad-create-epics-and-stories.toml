# bmad-guard team override for bmad-create-epics-and-stories (BMAD 6.12.4). Installed by
# scripts/setup_guard.py; do not edit in a project. Project-specific facts: add markdown files under
# _bmad/custom/project/bmad-create-epics-and-stories/ (loaded by the persistent_facts entry).
#
# Stories in a guarded project come from the story slicer (ADR 0010), so this skill only redirects and stops.

[workflow]
persistent_facts = [
  "file:{project-root}/_bmad/custom/project/bmad-create-epics-and-stories/*.md",
]
activation_steps_prepend = [
  "Stop here (Guarded BMAD, ADR 0010): in a guarded project, stories are written by the story slicer (`experion-story-slicer`, Sloane) from the approved FRDs, as thin pointers to the FRD. Tell the user this in one or two sentences, name `experion-story-slicer`, and stop. Write no epics, no stories and no files, and do not go on with this workflow.",
]
