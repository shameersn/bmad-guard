# bmad-guard team override for bmad-build (BMAD 6.12.4). Installed by scripts/setup_guard.py;
# do not edit in a project. Project-specific facts (e.g. which context files to load): add markdown
# files under _bmad/custom/project/bmad-build/ (loaded by the last persistent_facts entry).
#
# Replaces the overrides for bmad-create-story, bmad-dev-story and bmad-quick-dev, which BMAD 6.12.4
# folded into bmad-build. Their org-wide rules are below; their project-specific context lines are not.

[workflow]
persistent_facts = [
  "Ready-for-dev gate (Guarded BMAD, ADR 0004): before planning or coding a story, run skill:ready-for-dev-gate on the story file (story_path=<story path>, downstream_label='implementation planning'). On allow, continue. On block, show every reason with its ids and stop: in the gate's `mode` = enforce this is a hard stop; in `mode` = advisory (a project's own choice; the write gate hook still blocks source writes) report the block and continue only if the user explicitly decides to, as the gate skill describes. Never edit the story's questions, assumptions, resolutions, `gate` marker or confidence to make the gate pass.",
  "Feature FRD (Guarded BMAD): before the ready-for-dev gate, read the story's frontmatter `feature` (a PRD feature id such as F-001) and copy it into the spec's frontmatter. If it is set, run skill:agent-approval-gate-check with doc_type='frd-<feature>' (e.g. 'frd-F-001'), doc_path=<the FRD: {project-root}/_bmad-output/planning-artifacts/frds/<feature>/frd.md>, doc_label='FRD for <feature>', downstream_label='implementation planning', status_field='approval_status'. On ok, continue; on any other result, show it and stop. A missing FRD or an FRD edited after approval blocks every story of that feature until Warden approves it again. Never edit the FRD's approval fields, questions or resolutions, or the story's `feature`, to make it pass.",
  "Requirements from the FRD (Guarded BMAD, ADR 0010): a story file holds no acceptance criteria; they stay in the approved FRD. Read the story's frontmatter `requirements` (a one-line list such as [FR-F001-02] or [FR-F001-04#1-4]) and copy it into the spec's frontmatter next to `feature`. If it is set, not empty and not `none`, run `python3 \"{project-root}/.claude/skills/ready-for-dev-gate/scripts/frd_parse.py\" --frd <the FRD path above> --ids <the requirements value>` (use `.agents/skills` when the project has no `.claude/skills`) and read the one JSON it prints. On `result` = ok, use the returned blocks as the story's acceptance criteria: each block's Section 4 criteria and key transactions, its Section 5 screens and the Section 8.1 NFR rows. A requirement written FR-F001-04#1-4 returns only criteria 1 to 4. The spec's Scope Summary names the FR ids and the Section 4 numbers, and its Test Strategy covers every returned criterion. On `result` = problems, or if the command exits with a non-zero code, show every problem and stop: the ready-for-dev gate blocks the story too. Never invent acceptance criteria from the story title, and never edit the FRD or the story's `requirements` to make it pass. Run the command again when you resume a spec; do not trust an old copy. A story with `gate: technical` has no FRD: its source is the section of the approved architecture that it names, so make no FRD call. A story without `requirements` (written before ADR 0010) is built as before.",
  "Plan-first hard gate (Guarded BMAD): before generating or modifying any code, use the spec at {spec_file} as the implementation plan. Keep Build's phase `status` (draft, ready-for-dev, in-progress, in-review, done) separate from `approval_status` (pending-approval, approved). The plan's frontmatter carries story, date, status, approval_status, confidence, confidence_label and confidence_rationale, and the plan has these sections: Scope Summary, Impacted Modules & Files, Detailed Design Approach, Data Model Usage, API/Interface Changes, Error Handling & Edge Cases, Security Considerations, Performance Considerations, Test Strategy, Risks/Assumptions & Dependencies, Context Files Consulted, Rationale Summary. Present the plan and STOP. Write no code until Warden has two separate explicit confirmations from the user; a general 'yes', 'looks good' or 'go ahead' cannot count as both. Never write `approval_status: approved` yourself.",
  "Plan confidence (Guarded BMAD): before presenting the plan, self-assess `confidence` (0-100), `confidence_label` (Low <50, Medium 50-79, High 80+) and `confidence_rationale` (1-2 sentences) for how much of the plan rests on confirmed input (approved architecture, PRD, story acceptance criteria) versus inference. FRD blocks fetched with frd_parse.py count as confirmed input, and so does the approved architecture section a technical story names. Lower it for each assumption, unresolved library or version question, or story detail the plan had to guess. Write all three into the plan's frontmatter, show them with the plan, and log via skill:agent-project-logger with action 'Confidence scored for implementation plan', event='CONFIDENCE_SCORED', stage='implementation-plan', doc_status='pending-approval', doc_path=<plan path>, confidence=<confidence>, confidence_label=<label>, confidence_rationale=<rationale>.",
  "Approval and gate (Guarded BMAD): get approval through skill:agent-approval-grant in Build integration mode, with doc_type='build:<plan path relative to the project root>' (one approval per plan), status_field='approval_status', create_status_field, hash_mode='build', no commit, approved_by=<user_name> and requested_at=<UTC time the plan was presented>. On approval set `status` to ready-for-dev. Before every new or resumed coding phase run skill:agent-approval-gate-check with the same doc_type and doc_path, status_field='approval_status', draft_value='pending-approval', and stop on any result other than ok. If the plan changes materially after approval, the gate resets `approval_status` to pending-approval; get approval again.",
  "Write gate (Guarded BMAD): after the approved plan's `status` is in-progress (in-review for review patches) and before the first code change of a coding phase, run `python3 \"{project-root}/.claude/skills/tool-guard/scripts/write_gate.py\" --check` (use `.agents/skills` when the project has no `.claude/skills`). Exit code 0: continue. Any other exit code: show the printed reasons to the user and stop; write no code. The same check runs as a hook on every source write (file tools and shell redirects, `cp`, `mv`, `sed -i`), so a block there has the same cause. Never edit the plan's approval fields, the story's questions, assumptions, resolutions or `gate` marker, or `_bmad-output/guard/`, to make it pass.",
  "Scope (Guarded BMAD): generated code stays strictly within the approved plan's files, modules and schemas. Do not change files outside that scope, introduce new patterns, or refactor out-of-scope code without stopping to ask first.",
  "Lifecycle log (Guarded BMAD): use skill:agent-project-logger for phase boundaries only (plan, approval, gate, coding, verification, review, patch loop, completion or failure), all with one run_id, stage='build' and a non-negative duration_seconds where a phase ended. Never put prompts, diffs, code, secrets or approval phrases in log fields. A logger failure is a warning; an approval or gate failure stops the build.",
  "file:{project-root}/_bmad/custom/project/bmad-build/*.md",
]

# Runs after Build completes. The scorer records one CODE_SCORED event per file itself.
on_complete = "Invoke skill:confidence-scorer once per file changed since {baseline_commit} (never batched, never skipped). For each file: get tests passed and failed and lint errors and warnings by running the project's test runner and linter for that file, and lines changed from `git diff --stat {baseline_commit} -- <file>`. Pass --revision-cycles = {spec_file} frontmatter `review_loop_iteration` (0 if absent), --doc-status = {spec_file} frontmatter `status` (now done), --doc-type 'build:<plan path relative to the project root>' and --stage build. Then report the file / confidence / label table to the user, weakest first."
