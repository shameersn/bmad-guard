# bmad-guard team override for bmad-code-review (BMAD 6.12.4). Installed by scripts/setup_guard.py;
# do not edit in a project. Project-specific facts (e.g. which context files to load before a review):
# add markdown files under _bmad/custom/project/bmad-code-review/ (loaded by the last entry below).

[workflow]
persistent_facts = [
  "Independent review (Guarded BMAD): this review must run in a fresh session, never the session that generated the code under review, to avoid self-review bias. If this session also generated the code, say so plainly and recommend restarting the review in a fresh session before going on.",
  "Severity levels (Guarded BMAD): report findings with exactly these levels. CRITICAL: security flaw or data-loss risk; must be fixed before going on; escalate to the Tech Lead. HIGH: plan deviation, unhandled exception or performance risk; must be resolved before developer review. MEDIUM: standards violation, missing log, naming issue; should be fixed, or the developer records why not. LOW: style or minor suggestion; optional.",
  "Diff-to-plan check (Guarded BMAD): in every review, list every changed file from git diff and compare it with the plan's Impacted Modules & Files. A file in the diff but not in the plan is a finding; a file in the plan but not in the diff is a sign of incomplete work. Put the result of this check in the review output.",
  "FRD check (Guarded BMAD, ADR 0010): when the story or the spec has frontmatter `feature` (not none) and `requirements`, find the feature's FRD at {project-root}/_bmad-output/planning-artifacts/frds/<feature>/frd.md and run `python3 \"{project-root}/.claude/skills/ready-for-dev-gate/scripts/frd_parse.py\" --frd <that path> --ids <the requirements value>` (use `.agents/skills` when the project has no `.claude/skills`). On `result` = ok, check the diff against every returned acceptance criterion and key transaction. Name the FR id and the criterion number in each finding, for example FR-F001-02 criterion 3. A criterion with no code and no test as evidence is a finding. On `result` = problems, or a non-zero exit code, show the problems, record the FRD check as not done, and lower the review confidence. A story without `requirements` has no FRD check; a technical story (`gate: technical`) is checked against the approved architecture section it names.",
  "Review confidence (Guarded BMAD): at the Present step, before announcing results, self-assess `confidence` (0-100), `confidence_label` (Low <50, Medium 50-79, High 80+) and `confidence_rationale` (1-2 sentences) for how complete THIS REVIEW was, not how good the code is. Lower it for any entry in {failed_layers}, for {review_mode} = 'no-spec' (acceptance criteria could not be checked), for a diff that was chunked or too large to review whole, and for any finding marked best-effort. Show the score with the summary (in the story's Review Findings section when {spec_file} is set). Then log via skill:agent-project-logger with action 'Confidence scored for code review', event='CONFIDENCE_SCORED', stage='code-review', doc_path=<{spec_file} if set>, confidence=<confidence>, confidence_label=<label>, confidence_rationale=<rationale>.",
  "file:{project-root}/_bmad/custom/project/bmad-code-review/*.md",
]

# Runs at the end of the workflow, after the findings are presented and the sprint status is synced (BMAD 6.12.4,
# steps/step-04-present.md, "On Complete"). Records the review for the pre-push hook (Phase 2, T7).
on_complete = "Review record (Guarded BMAD): as the very last step, record this review. Choose the verdict by the test BMAD uses to set the story to done: `pass` only when no `decision-needed` or `patch` finding is left unresolved and no unresolved `high` or `medium` finding remains; otherwise `fail`. The record covers the commits up to HEAD. Code that is not committed, and patches applied in this run, are not covered: tell the developer to commit them and have them reviewed again in a new fresh session. A session that applied patches may have written code for this story, and then the pre-push hook refuses its record, so prefer `Leave as action items` in a review you record. Run exactly one plain command and nothing else on the line (no pipe, no `&&`, no `cd`, no redirect, no variable): `python3 \"{project-root}/.claude/skills/tool-guard/scripts/review_record.py\" --story <story> --verdict <pass or fail>` (use `.agents/skills` when the project has no `.claude/skills`). `<story>` is the story id (the plan's `story` field, for example 2-3) or the story file path. Never pass a session id and never write the record yourself: the tool-guard hook writes `_bmad-output/guard/reviews/<story>.json` with this session's id and the HEAD commit, and the command only checks that it did. Exit code 0: tell the developer to commit that file in a commit of its own (it must not hold code changes) so the push carries it. Any other exit code: show the printed reason and stop. Do not edit anything in `_bmad-output/guard/`."
