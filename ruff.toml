# Lint and format rules for bmad-guard. Spikes are throwaway and not checked.
target-version = "py310"
line-length = 120
extend-exclude = ["spikes"]
extend-include = ["module/hooks/pre-commit"]  # a Python script with no .py extension

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S101",  # assert is fine in tests
    "S603",  # subprocess without shell: we call git and our own scripts
    "S607",  # partial executable path: "git" is resolved from PATH on purpose
]

[lint.per-file-ignores]
# Live test script for the local Docker stack: fixed http://127.0.0.1 URLs and queries on its own fake test ids.
"deploy/collector/run_live_tests.py" = ["S104", "S310", "S608"]
# Live check for T4: fixed local URLs, a fake token shape from random, SQL on its own fake ids, long SQL strings.
"deploy/collector/run_telemetry_live.py" = ["E501", "S310", "S311", "S608"]
