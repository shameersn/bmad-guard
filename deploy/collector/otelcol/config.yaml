# Collector config (from the T3 spike, hardened in GUARD-3 T2).
# - basicauth/server: one htpasswd line per developer (user = developer id, password = ingest key). Hashes are bcrypt (keys.py).
# - Logs and metrics use the same chain: auth, user stamp, scrub.
# - attributes/who: overwrite the "user" attribute with the authenticated user. Clients cannot fake it.
# - clickhouse: insert-only DB user; the admin creates the schema (create_schema: false).
extensions:
  basicauth/server:
    htpasswd:
      file: /etc/otelcol/keys/devkeys.htpasswd
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        include_metadata: true
        auth:
          authenticator: basicauth/server

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
  attributes/who:
    actions:
      - key: user
        from_context: auth.username
        action: upsert
  # Claude Code telemetry carries personal and machine data. We already know the user from the key, so drop it
  # (no personal data in the event store). Reviewed 2026-11-26 against Claude Code 2.1.332; the list and the
  # keep/drop decision for each attribute are in README.md ("Scrub list"). Review it on each Claude Code upgrade.
  attributes/scrub:
    actions:
      - key: user.email
        action: delete
      - key: user.account_uuid
        action: delete
      - key: user.account_id
        action: delete
      - key: user.id            # Claude Code's anonymous id (in ~/.claude.json): a second id for the same person
        action: delete
      - key: organization.id
        action: delete
      - key: workspace.host_paths   # folders on the laptop: they hold the developer's account name
        action: delete
  # Resource attributes (not log attributes). Off by default in Claude Code (OTEL_RESOURCE_INCLUDE_HOST); removed
  # here in case someone turns them on.
  resource/scrub:
    attributes:
      - key: host.name
        action: delete
      - key: host.id
        action: delete
  batch:
    timeout: 2s

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: guard
    username: otel_writer
    password: ${env:CLICKHOUSE_WRITER_PASSWORD}
    logs_table_name: guard_events
    # Metrics go to guard.otel_metrics_sum / otel_metrics_gauge (the exporter's default names), created by
    # clickhouse/init/02-metrics.sh. The writer has INSERT only, so the exporter must not create anything.
    create_schema: false
    timeout: 10s
    retry_on_failure:
      enabled: true

service:
  extensions: [basicauth/server, health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/who, attributes/scrub, resource/scrub, batch]
      exporters: [clickhouse]
    # Same receiver (so the same basic auth), the same user stamping and scrub. The attributes processor works on
    # datapoint attributes for metrics; resource/scrub works on the resource.
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/who, attributes/scrub, resource/scrub, batch]
      exporters: [clickhouse]
